              <div class="note-section-heading">1. 平衡条件</div>
              <div class="note-line">封闭体系，恒温恒压下：</div>
              <div class="note-equation">dG = −S dT + V dp + ∑ μᵢ dnᵢ</div>
              <div class="note-emphasis"><span>相平衡时，各相中同一组分的化学势相等。</span></div>
              <div class="note-equation centered">μᵢ<sup>α</sup> = μᵢ<sup>β</sup></div>
              <div class="note-section-heading second-heading">2. 化学势与组成</div>

    });ctx.globalAlpha=1;
  }
  function applyTheme() {app.dataset.theme=state.theme;one('.preview-theme .ms').textContent=state.theme==='dark'?'light_mode':'dark_mode';one('.theme-label').textContent=state.theme==='dark'?'浅色预览':'深色预览';renderInk();}
  function applyDevice() {app.dataset.device=state.device;all('[data-device]').filter(el=>el.tagName==='BUTTON').forEach(el=>el.setAttribute('aria-pressed',el.dataset.device===state.device));app.classList.remove('drawer-pages','drawer-sections');requestAnimationFrame(renderInk);}
  function closeDialog() {one('.md-dialog').hidden=true;one('.md-scrim').hidden=true;}
  function showDialog(title,html) {one('.md-dialog-title').textContent=title;one('.md-dialog-content').innerHTML=html;one('.md-dialog').hidden=false;one('.md-scrim').hidden=false;one('.md-pen-popover').hidden=true;}
  function showLoading() {
    clearTimeout(loadingTimer);const loader=one('.md-loader');loader.hidden=false;
    loadingTimer=setTimeout(()=>loader.hidden=true,2600);
  }
  function selectPage(title) {
    state.page=title;one('.note-title').textContent=title;all('.md-page').forEach(el=>el.classList.toggle('selected',el.dataset.page===title));
    one('.sample-notes').hidden=title!=='相平衡与化学势';strokes=[];redo=[];renderInk();app.classList.remove('drawer-pages','drawer-sections');closeDialog();
  }
  function showNewPage() {showDialog('新建页面','<label for="md-new-title">页面名称</label><input id="md-new-title" type="text" value="未命名页面"><label class="md-switch-row"><span>点阵背景</span><input type="checkbox" checked><span class="md-switch-track" aria-hidden="true"></span></label><button type="button" data-action="create-page">创建页面'+icon('arrow_forward')+'</button>');}
  function toolbar(tab) {
    state.tab=tab;all('[data-tab]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.tab===tab));one('.md-toolbar').hidden=tab!=='draw';one('.md-secondary-tools').hidden=tab==='draw';
    const choices={home:[['content_paste','粘贴'],['format_bold','加粗'],['format_italic','倾斜'],['format_color_text','文字颜色'],['format_list_bulleted','列表']],insert:[['image','图片'],['picture_as_pdf','PDF'],['attach_file','附件'],['table','表格'],['link','链接']],view:[['format_line_spacing','背景格式'],['dark_mode','暗色模式'],['width','适应宽度'],['splitscreen','分屏'],['fullscreen','整页视图']]};
    if(choices[tab])one('.md-secondary-tools').innerHTML=choices[tab].map(([name,label])=>'<button type="button" data-command="'+label+'">'+icon(name)+label+'</button>').join('');
  }
  root.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b)return;
    if(b.dataset.device){state.device=b.dataset.device;applyDevice();persist();return;}
    if(b.classList.contains('preview-theme')){state.theme=state.theme==='dark'?'light':'dark';applyTheme();persist();return;}
    if(b.dataset.tab){toolbar(b.dataset.tab);persist();return;}
    if(b.dataset.page){selectPage(b.dataset.page);return;}
    if(b.dataset.section){all('[data-section]').forEach(el=>el.classList.toggle('selected',el===b));one('.md-current-section').textContent=b.dataset.section;if(state.device!=='desktop'||app.clientWidth<850){app.classList.remove('drawer-sections');app.classList.add('drawer-pages');}return;}
    if(b.dataset.notebook){all('[data-notebook]').forEach(el=>el.classList.toggle('selected',el===b));notify('已选择「'+b.dataset.notebook+'」');return;}
    if(b.dataset.ink){state.ink=b.dataset.ink;all('[data-ink]').forEach(el=>{el.classList.toggle('selected',el===b);el.innerHTML=el===b?'<span class="ms small" aria-hidden="true">check</span>':'';});const color='var(--md-'+(state.ink==='neutral'?'ink':state.ink)+')';one('.md-ink-sample').style.color=color;one('.pen-color').style.background=color;persist();return;}
    if(b.dataset.tool){const was=state.tool===b.dataset.tool;state.tool=b.dataset.tool;all('[data-tool]').forEach(el=>{el.classList.toggle('selected',el===b);el.setAttribute('aria-pressed',el===b);});if(state.tool==='pen'&&was)one('.md-pen-popover').hidden=!one('.md-pen-popover').hidden;else one('.md-pen-popover').hidden=true;canvas.style.cursor=state.tool==='pan'?'grab':'crosshair';persist();return;}
    if(b.dataset.command){const c=b.dataset.command;if(c==='暗色模式'){state.theme=state.theme==='dark'?'light':'dark';applyTheme();}else if(c==='整页视图'){app.classList.toggle('full-page');}else if(c==='背景格式'){state.grid=!state.grid;one('.md-paper').style.backgroundImage=state.grid?'':'none';}else if(c==='适应宽度'){state.zoom=100;one('.md-zoom-value').textContent='100%';}else notify(c+'预览');return;}
    switch(b.dataset.action){
      case 'undo': if(strokes.length){redo.push(strokes.pop());renderInk();}else notify('没有可撤销的试写');break;
      case 'redo': if(redo.length){strokes.push(redo.pop());renderInk();}break;
      case 'sections':app.classList.remove('drawer-pages');app.classList.toggle('drawer-sections');break;
      case 'pages':app.classList.remove('drawer-sections');app.classList.toggle('drawer-pages');break;
      case 'new':showNewPage();break;
      case 'new-notebook':showDialog('新建','<button type="button" data-action="new">'+icon('book_2')+'新建笔记本</button><button type="button" data-action="new">'+icon('create_new_folder')+'新建分区</button>');break;
      case 'create-page':{const value=one('#md-new-title').value.trim()||'未命名页面';pages.push(value);const item=document.createElement('button');item.type='button';item.className='md-page';item.dataset.page=value;const title=document.createElement('span');title.className='page-title';title.textContent=value;const sub=document.createElement('span');sub.className='page-subtitle';sub.textContent='刚刚';item.append(title,sub);one('.md-page-list').append(item);selectPage(value);notify('已创建页面');break;}
      case 'paper':state.grid=!state.grid;one('.md-paper').style.backgroundImage=state.grid?'':'none';break;
      case 'full':app.classList.toggle('full-page');requestAnimationFrame(renderInk);break;
      case 'close-popover':one('.md-pen-popover').hidden=true;break;
      case 'close-dialog':closeDialog();break;
      case 'zoom-in':state.zoom=Math.min(400,Math.round(state.zoom*1.05));one('.md-zoom-value').textContent=state.zoom+'%';break;
      case 'zoom-out':state.zoom=Math.max(50,Math.round(state.zoom/1.05));one('.md-zoom-value').textContent=state.zoom+'%';break;
      case 'settings':showDialog('选项','<label class="md-switch-row"><span>暗色模式</span><input class="md-theme-setting" type="checkbox" '+(state.theme==='dark'?'checked':'')+'><span class="md-switch-track" aria-hidden="true"></span></label><button type="button" data-action="paper">默认页面背景<span>点阵</span></button><button type="button" data-action="loading-demo">加载动效'+icon('motion_play')+'</button><button type="button" data-action="shortcuts">键盘与笔快捷键'+icon('keyboard')+'</button>');break;
      case 'loading-demo':closeDialog();showLoading();break;
      case 'shortcuts':showDialog('快捷键','<span>撤销　Ctrl + Z</span><span>重做　Ctrl + Y</span><span>删除所选　Delete</span><span>整页视图　F11</span>');break;
      case 'search':showDialog('搜索笔记','<input type="search" class="md-search" aria-label="搜索笔记" placeholder="搜索页面…"><div class="md-search-results"></div>');one('.md-search-results').innerHTML=pages.map(t=>'<button type="button" data-page="'+t+'">'+t+icon('arrow_forward')+'</button>').join('');break;
      case 'add-tool':showDialog('添加工具','<button type="button" data-tool="pen">'+icon('stylus_note')+'钢笔</button><button type="button" data-tool="highlight">'+icon('ink_highlighter')+'荧光笔</button><button type="button" data-tool="shape">'+icon('shapes')+'形状</button>');break;
      case 'preset':notify('Notein 风格');break;
    }
  });
  root.addEventListener('input',e=>{if(e.target.id==='md-pen-width'){state.width=Number(e.target.value);one('.md-width-value').textContent=(state.width/10).toFixed(1)+' mm';one('.md-ink-sample path').setAttribute('stroke-width',state.width*.5+1);persist();}if(e.target.classList.contains('md-search'))all('.md-search-results button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));});
  root.addEventListener('change',e=>{if(e.target.classList.contains('md-theme-setting')){state.theme=e.target.checked?'dark':'light';applyTheme();persist();}});
  one('.md-scrim').addEventListener('click',closeDialog);
  root.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();one('.md-pen-popover').hidden=true;app.classList.remove('drawer-pages','drawer-sections');}});
  function point(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];}
  canvas.addEventListener('pointerdown',e=>{one('.md-pen-popover').hidden=true;if(state.tool==='eraser'){if(strokes.length){redo.push(strokes.pop());renderInk();}return;}if(!['pen','highlight'].includes(state.tool))return;canvas.setPointerCapture(e.pointerId);drawing={color:'--md-'+(state.ink==='neutral'?'ink':state.ink),width:state.tool==='highlight'?14:state.width*.4+1,highlight:state.tool==='highlight',points:[point(e)]};});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;drawing.points.push(point(e));renderInk();});
  canvas.addEventListener('pointerup',()=>{if(drawing){strokes.push(drawing);drawing=null;redo=[];renderInk();}});
  canvas.addEventListener('pointercancel',()=>{drawing=null;renderInk();});
  new ResizeObserver(renderInk).observe(canvas);
  const saved=window.openai?.widgetState;
  if(saved?.modelContent?.device)state.device=saved.modelContent.device;
  if(saved?.modelContent?.theme)state.theme=saved.modelContent.theme;
  applyDevice();applyTheme();
  if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{applyDevice();applyTheme();}});tweak.addSelect(state,'theme',{label:'主题',options:[{label:'深色',value:'dark'},{label:'浅色',value:'light'}]});tweak.addSelect(state,'device',{label:'布局',options:[{label:'桌面三栏',value:'desktop'},{label:'平板双栏',value:'tablet'},{label:'手机单栏',value:'phone'}]});}
})();
</script>
